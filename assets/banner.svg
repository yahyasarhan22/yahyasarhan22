<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Yahya Sarhan — Full-Stack Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0E1E3A"/>
      <stop offset="1" stop-color="#132F55"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6EDF3"/>
      <stop offset="1" stop-color="#8CC8FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#D4A84B"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4A84B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D4A84B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8CC8FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .float1 { animation: f1 9s ease-in-out infinite; }
      .float2 { animation: f2 11s ease-in-out infinite; }
      .fade { opacity: 0; animation: in 0.9s ease-out forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .85s }
      .caret { animation: blink 1.1s steps(1) infinite; }
      .line { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1.4s .5s ease-out forwards; }
      @keyframes f1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(40px,18px) } }
      @keyframes f2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-36px,-14px) } }
      @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      @keyframes blink { 50% { opacity: 0 } }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important } }
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="float1" cx="980" cy="70" r="230" fill="url(#glowBlue)"/>
    <circle class="float2" cx="760" cy="300" r="200" fill="url(#glowGold)"/>

    <!-- code window motif -->
    <g transform="translate(790 70)"><g class="fade d3">
      <rect width="330" height="180" rx="14" fill="#0B1220" fill-opacity="0.72" stroke="#8CC8FF" stroke-opacity="0.18"/>
      <circle cx="22" cy="20" r="5" fill="#FF5F57"/><circle cx="40" cy="20" r="5" fill="#FEBC2E"/><circle cx="58" cy="20" r="5" fill="#28C840"/>
      <text class="mono" x="22" y="62" font-size="15" fill="#8B949E">const <tspan fill="#E6EDF3">yahya</tspan> = {</text>
      <text class="mono" x="42" y="88" font-size="15" fill="#7EE787">stack<tspan fill="#8B949E">: </tspan><tspan fill="#A5D6FF">"full"</tspan><tspan fill="#8B949E">,</tspan></text>
      <text class="mono" x="42" y="114" font-size="15" fill="#7EE787">rtl<tspan fill="#8B949E">: </tspan><tspan fill="#79C0FF">true</tspan><tspan fill="#8B949E">,</tspan></text>
      <text class="mono" x="42" y="140" font-size="15" fill="#7EE787">shipping<tspan fill="#8B949E">: </tspan><tspan fill="#D4A84B">"daily"</tspan></text>
      <text class="mono" x="22" y="166" font-size="15" fill="#8B949E">};<tspan class="caret" fill="#58A6FF"> ▍</tspan></text>
    </g></g>

    <!-- text -->
    <text x="72" y="84" font-size="16" letter-spacing="3" fill="#8CC8FF" class="fade d1">HI, I'M</text>
    <text x="70" y="148" font-size="60" font-weight="700" fill="url(#name)" class="fade d1">Yahya Sarhan</text>
    <text x="72" y="194" font-size="26" fill="#C9D1D9" class="fade d2">يحيى سرحان</text>
    <path class="line" d="M72 216 H472" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <text x="72" y="254" font-size="22" font-weight="600" fill="#E6EDF3" class="fade d3">Full-Stack Web Developer</text>
    <text x="72" y="284" font-size="17" fill="#8B949E" class="fade d4">Computer Engineering · Birzeit University · Ramallah, Palestine</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#8CC8FF" stroke-opacity="0.15"/>
</svg>
